name: intencion_siembra
description: Mobile app for agricultural planting intention management
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  provider: ^6.1.1
  
  # HTTP client
  http: ^1.1.2
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # Image handling
  image_picker: ^1.0.7
  
  # Notifications
  flutter_local_notifications: ^17.0.0
  
  # Date formatting
  intl: ^0.19.0
  
  # Forms
  flutter_form_builder: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
